<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Orel Teklya Portfolio</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fc;
      margin: 0;
      padding: 0;
      color: #333;
      text-align: center;
    }

    header {
      background: linear-gradient(120deg, #a8edea, #fed6e3);
      padding: 60px 20px;
      font-size: 2.5em;
      font-weight: bold;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      color: #444;
      margin: 40px 0 20px 0;
    }

    /* --- עיצוב העיגולים --- */
    .projects-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .project-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      color: #333;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .project-circle:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .project-circle p {
      padding: 0 10px;
      font-size: 1em;
    }

    footer {
      background: linear-gradient(120deg, #a8edea, #fed6e3);
      color: #333;
      text-align: center;
      padding: 30px 20px;
      margin-top: 50px;
      border-radius: 12px 12px 0 0;
    }

    footer a {
      color: #2575fc;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .projects-grid {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    Welcome to My Portfolio! 🎉
  </header>

  <div class="container">
    <p>Hello, my name is <strong>Orel Teklya</strong> and I specialize in Data Analysis and BI.</p>

    <h2>📊 SQL Projects</h2>
    <div class="projects-grid">
      <a href="./SQL/Project_1.sql" class="project-circle">
        <p>Project 1<br>SQL</p>
      </a>
      <a href="./SQL_2/Project_2.sql" class="project-circle">
        <p>Project 2<br>SQL</p>
      </a>
    </div>

    <h2>🐍 Python Projects</h2>
    <div class="projects-grid">
      <a href="./PYTHON/project3a.ipynb" class="project-circle">
        <p>Project 1<br>Python</p>
      </a>
    </div>

    <h2>📈 Power BI Projects</h2>
    <div class="projects-grid">
      <a href="./Power_BI/Project_4.pbix" class="project-circle">
        <p>Project 1<br>Power BI</p>
      </a>
    </div>

    <footer>
      <p>📬 Contact Me</p>
      <p>Phone: 052-3433709 | Email: <a href="mailto:orelb13@gmail.com">orelb13@gmail.com</a></p>
    </footer>
  </div>

</body>
</html>
